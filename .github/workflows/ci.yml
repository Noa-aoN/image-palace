name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで連続 push したとき、古い実行をキャンセルする
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (rubocop + rspec)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: image_palace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/image_palace_test
      # libvips 不在を理由に画像テストが黙ってスキップされるのを禁止する
      REQUIRE_VIPS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # 本番と同じ production ターゲットのイメージで検証する。
      # libvips のローダ構成（不要モジュールの削除）はイメージの性質なので、
      # 素のランナーに libvips を入れても本番の検証にはならない
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          load: true
          tags: image-palace-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint (rubocop)
        run: docker run --rm image-palace-backend:ci bundle exec rubocop

      - name: Prepare DB
        run: docker run --rm --network host -e RAILS_ENV -e TEST_DATABASE_URL image-palace-backend:ci bundle exec rails db:schema:load

      # VIPS_BLOCK_UNTRUSTED はあえて渡さない。渡すと initializer が消えても
      # 環境変数側で守られてしまい、initializer の回帰を検知できなくなる。
      # 環境変数の層は spec が fly.toml を静的検査して担保する
      - name: Test (rspec)
        run: docker run --rm --network host -e RAILS_ENV -e TEST_DATABASE_URL -e REQUIRE_VIPS image-palace-backend:ci bundle exec rspec

      # ローカルの Docker からは advisory DB を取得できないため、gem の脆弱性検査は CI を正とする
      - name: Audit gems (bundler-audit)
        run: docker run --rm image-palace-backend:ci bundle exec bundle-audit check --update

      - name: Static analysis (brakeman)
        run: docker run --rm image-palace-backend:ci bundle exec brakeman -q --no-pager

  frontend:
    name: Frontend (eslint + tsc + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # node 22 は .ts ファイルのネイティブ import をサポート（test/ が .ts を import するため必須）
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run type-check

      - name: Unit test (node:test)
        run: npm run test:unit

      - name: Unit test (vitest)
        run: npm run test

      # 本番に載る依存のみ検査する（devDependencies のノイズを避ける）
      - name: Audit dependencies (npm audit)
        run: npm audit --omit=dev --audit-level=high
