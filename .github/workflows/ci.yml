name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで連続 push したとき、古い実行をキャンセルする
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (rubocop + rspec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: image_palace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/image_palace_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Lint (rubocop)
        run: bundle exec rubocop

      - name: Prepare DB
        run: bundle exec rails db:schema:load

      - name: Test (rspec)
        run: bundle exec rspec

  frontend:
    name: Frontend (eslint + tsc + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # node 22 は .ts ファイルのネイティブ import をサポート（test/ が .ts を import するため必須）
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run type-check

      - name: Unit test (node:test)
        run: npm run test:unit

      - name: Unit test (vitest)
        run: npm run test
