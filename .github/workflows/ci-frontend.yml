name: CI (frontend)

# frontend/ が変わったときだけ動かす。分割の経緯は ci-backend.yml のコメントを参照。
# このジョブは実測1.8分＝課金2分/回。backend だけ触った変更（直近50コミット中16件）で払わずに済む。
#
# 検査の中身は分割前（ci.yml）と同一。frontend の検証に要るものが frontend/ の外に出たら、
# 必ずここの paths に足すこと（漏れると検査が黙って走らなくなる）。

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

# 同じブランチで連続 push したとき、古い実行をキャンセルする
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (eslint + tsc + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # node 22 は .ts ファイルのネイティブ import をサポート（test/ が .ts を import するため必須）
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run type-check

      - name: Unit test (node:test)
        run: npm run test:unit

      - name: Unit test (vitest)
        run: npm run test

      # 本番に載る依存のみ検査する（devDependencies のノイズを避ける）
      #
      # **npm の audit エンドポイントは落ちる。** 実際に 400 / 503 が続けて返り、
      # コードと無関係に PR が止まった（"This endpoint is being retired" とも出る）。
      #
      # 落ちたことを「脆弱性なし」とは扱わない。**脆弱性が見つかったときは止め、
      # 繋がらなかったときは警告として残す。** 区別せずに `|| true` を付けると、
      # 本物の指摘まで黙って通ることになる。
      - name: Audit dependencies (npm audit)
        run: |
          set +e
          for attempt in 1 2 3; do
            output=$(npm audit --omit=dev --audit-level=high 2>&1)
            status=$?
            if [ $status -eq 0 ]; then
              echo "$output"
              exit 0
            fi
            if echo "$output" | grep -q "audit endpoint returned an error"; then
              echo "npm の audit エンドポイントに繋がりません（${attempt}回目）"
              sleep 20
              continue
            fi
            echo "$output"
            exit $status
          done
          echo "::warning::npm audit のエンドポイントに繋がらないため、今回は検査できませんでした"
