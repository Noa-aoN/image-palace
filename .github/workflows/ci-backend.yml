name: CI (backend)

# backend/ が変わったときだけ動かす。
#
# ■ 分割した理由（2026-08-16）
# GitHub Actions の private 無料枠 2,000分/月はアカウント全体の共有で、これを使い切って
# 同じアカウントの他リポジトリ（personal-rss の日報配信）まで5日間止めてしまった。
# 課金は**ジョブ単位で分を切り上げ**るので、このジョブは実測4.2分＝毎回5分として数えられる。
# 直近50コミットのうち backend を触ったのは 24件（frontend だけ 23件、docs 等だけ 3件）。
# frontend / docs しか触っていない変更でこの5分を払うのをやめるための分割。
#
# 検査の中身は分割前（ci.yml）と同一。paths に漏れがあると検査が黙って走らなくなるので、
# backend の検証に要るものが backend/ の外に出たら、必ずここの paths に足すこと。
# （fly.toml の静的検査 spec があるが、fly.toml は backend/fly.toml なので paths に含まれている）

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

# 同じブランチで連続 push したとき、古い実行をキャンセルする
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (rubocop + rspec)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: image_palace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/image_palace_test
      # libvips 不在を理由に画像テストが黙ってスキップされるのを禁止する
      REQUIRE_VIPS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 本番と同じ production ターゲットのイメージで検証する。
      # libvips のローダ構成（不要モジュールの削除）はイメージの性質なので、
      # 素のランナーに libvips を入れても本番の検証にはならない
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          load: true
          tags: image-palace-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint (rubocop)
        run: docker run --rm image-palace-backend:ci bundle exec rubocop

      - name: Prepare DB
        run: docker run --rm --network host -e RAILS_ENV -e TEST_DATABASE_URL image-palace-backend:ci bundle exec rails db:schema:load

      # VIPS_BLOCK_UNTRUSTED はあえて渡さない。渡すと initializer が消えても
      # 環境変数側で守られてしまい、initializer の回帰を検知できなくなる。
      # 環境変数の層は spec が fly.toml を静的検査して担保する
      - name: Test (rspec)
        run: docker run --rm --network host -e RAILS_ENV -e TEST_DATABASE_URL -e REQUIRE_VIPS image-palace-backend:ci bundle exec rspec

      # ローカルの Docker からは advisory DB を取得できないため、gem の脆弱性検査は CI を正とする。
      # advisory DB の取得に git が要るが、本番イメージには git を入れていない。
      # bundler-audit は Gemfile.lock だけ見れば足りるのでランナー側で実行する
      - name: Set up Ruby (bundler-audit 用)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Audit gems (bundler-audit)
        working-directory: backend
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update

      - name: Static analysis (brakeman)
        run: docker run --rm image-palace-backend:ci bundle exec brakeman -q --no-pager
