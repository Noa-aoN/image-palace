name = "image-palace-frontend"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Workers Paid プランの CPU 予算を明示する（既定と同値の 30 秒）。
# Free の 10ms 制限に対し、OpenNext の SSR/RSC が CPU 超過(Error 1102)で落ちないための余裕。
# 暴走時の上限にもなる。必要なら最大 300000ms(5分) まで引き上げ可。
[limits]
cpu_ms = 30000

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "image-palace-frontend"

[vars]
# 注意: NEXT_PUBLIC_* 変数はビルド時に静的置換されるため、
# ここに書いてもランタイムでは上書きされない。
# 実際の値は .env.production で管理する。
# （参考用として記載しているが、削除しても動作に影響なし）
NEXT_PUBLIC_API_BASE_URL = "https://api.imagepalace.app"
