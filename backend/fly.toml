# fly.toml app configuration file generated for image-palace-api on 2026-03-29T13:50:44+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'image-palace-api'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'bundle exec rails db:migrate db:seed'

[env]
  PORT = '8080'
  RAILS_ENV = 'production'
  RAILS_LOG_LEVEL = 'info'
  JOB_THREADS = '1'
  JOB_CONCURRENCY = '1'
  # libvips の信頼できないローダ（SVG/PDF 等）を無効化する。CVE-2026-66066 緩和策
  VIPS_BLOCK_UNTRUSTED = '1'

[processes]
  app = 'bundle exec rails server -b 0.0.0.0 -p 8080'
  worker = 'bundle exec bin/jobs'

[http_service]
  processes = [ 'app' ]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    # 瞬間的なジョブ負荷で Web 応答が一時的に遅れても unhealthy にせず、
    # ports 80/443 の間欠失敗を防ぐ（timeout/grace を延長、間隔を短縮して早期回復検知）。
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "10s"
    path = "/up"

[[vm]]
  processes = [ 'app' ]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  processes = [ 'worker' ]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
