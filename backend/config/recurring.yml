production:
  # 使い終わった challenge と、猶予を過ぎた確認の記録。
  # 放っておくと行が増え続ける（どちらも短命なもの）
  sweep_auth_leftovers:
    command: "WebauthnChallenge.sweep!; StrongAuthSession.sweep!"
    schedule: every day at 4:30am

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  expire_credit_grants:
    class: ExpireCreditGrantsJob
    schedule: at 4am every day
  # 期限が近いクレジットのお知らせ。失効させる前に流す（順番を入れ替えないこと）
  notify_expiring_credits:
    class: NotifyExpiringCreditsJob
    schedule: at 8am every day
  recover_stuck_generations:
    class: RecoverStuckGenerationsJob
    schedule: every 5 minutes
  # 一時的なもの（体験用の宮殿・工房室の下見）を片付ける。
  #
  # **10分おき。** 1宮殿を消すのに約1,900本の問い合わせが要るので、
  # 1回の量に上限（30）を置き、代わりに何度も回す。
  # 上限 30 × 6回/時 = 180/時で、1日に建てられる上限（500）に十分追いつく
  sweep_ephemeral:
    class: EphemeralCleanupJob
    schedule: every 10 minutes
